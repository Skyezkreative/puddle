{% extends 'core/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1 class=\"mb-6 text-2xl md:text-3xl\">{{ title }}</h1>

<form method="post" action="." enctype="multipart/form-data" class="max-w-2xl\">
    {% csrf_token %}

    <div class="space-y-4 text-sm md:text-base">
        {{ form.as_p }}
    </div>

    {% if form.errors or form.non_field_errors %}
        <div class=\"mb-3 p-4 md:p-6 bg-red-100 rounded-xl\">
            {% for field in form %}
                {{ field.errors }}
            {% endfor %}

            {{ form.non_field_errors }}
        </div>
    {% endif %}

    <button class=\"w-full md:w-auto mt-6 py-2 md:py-4 px-4 md:px-8 text-sm md:text-lg bg-teal-500 hover:bg-teal-700 rounded-xl text-white\">Submit</button>
</form>
{% endblock %}
